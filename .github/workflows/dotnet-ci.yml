name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore tests/TodoApi.Tests/TodoApi.Tests.csproj

      - name: Build
        run: dotnet build tests/TodoApi.Tests/TodoApi.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/TodoApi.Tests/TodoApi.Tests.csproj --no-build --configuration Release --verbosity normal